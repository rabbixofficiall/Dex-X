# Dex-X on AppVeyor — a Windows build with no card and no GitHub Actions.
#
# GitHub Actions is blocked on this account by a billing lock, and AppVeyor's
# free plan for PUBLIC repositories needs no payment method at all. This file
# builds the same two things the Actions workflow does:
#
#   * Dex-X-launcher.apk  — the phone half
#   * Dex-X-windows.zip   — the portable exe, its resources, and the installer
#
# To use it: appveyor.com → Sign in with GitHub → New project → pick Dex-X.
# Nothing else to configure; this file is the whole configuration.
#
# The image is Visual Studio 2022, which already carries Node, Rust, the Android
# SDK and any JDK; the install steps below only fill in what is missing, so a
# change in the image does not break the build silently.

version: 0.4.{build}
image: Visual Studio 2022
clone_depth: 1

environment:
  SCRCPY_VERSION: "5.0.1"
  matrix:
    - job_name: windows-x64

# `npx tauri build` runs the repo's beforeBuildCommand, which would rebuild the
# APK and the daemon from source. Both are built explicitly below, and the
# Windows image can be fussy about the order, so the script's own builds are
# stood down and the files produced here are used instead.
install:
  - ps: |
      $ErrorActionPreference = 'Stop'
      Write-Host "== what the image already has =="
      node --version
      cargo --version
      java -version 2>&1 | Select-Object -First 1
      if ($env:ANDROID_HOME) { Write-Host "ANDROID_HOME=$env:ANDROID_HOME" }
      if ($env:ANDROID_SDK_ROOT) { Write-Host "ANDROID_SDK_ROOT=$env:ANDROID_SDK_ROOT" }

  # JDK 17 if the image's default is not one.
  - ps: |
      $ok = $false
      if ($env:JAVA_HOME) {
        $j = Join-Path $env:JAVA_HOME 'bin\javac.exe'
        if (Test-Path $j) {
          $v = & $j -version 2>&1 | Out-String
          if ($v -match '17\.') { $ok = $true }
        }
      }
      if (-not $ok) {
        Write-Host "installing JDK 17"
        choco install temurin17 --no-progress -y
        $cand = Get-ChildItem 'C:\Program Files\Eclipse Adoptium' -Filter 'jdk-17*' -Directory -ErrorAction SilentlyContinue |
                Sort-Object Name -Descending | Select-Object -First 1
        if ($cand) { $env:JAVA_HOME = $cand.FullName; $env:Path = "$($cand.FullName)\bin;$env:Path" }
      }
      Write-Host "JAVA_HOME=$env:JAVA_HOME"

  # Android SDK: use the image's, or lay down the command-line tools.
  - ps: |
      $ErrorActionPreference = 'Stop'
      $sdk = $env:ANDROID_HOME
      if (-not $sdk -or -not (Test-Path $sdk)) { $sdk = $env:ANDROID_SDK_ROOT }
      if (-not $sdk -or -not (Test-Path $sdk)) { $sdk = Join-Path $env:LOCALAPPDATA 'Android\Sdk' }
      $mgr = Join-Path $sdk 'cmdline-tools\latest\bin\sdkmanager.bat'
      if (-not (Test-Path $mgr)) {
        $zip = Join-Path $env:TEMP 'cmdtools.zip'
        Invoke-WebRequest -Uri 'https://dl.google.com/android/repository/commandlinetools-win-13114758_latest.zip' -OutFile $zip
        Expand-Archive $zip -DestinationPath (Join-Path $env:TEMP 'cmdtools') -Force
        New-Item -ItemType Directory -Force -Path (Join-Path $sdk 'cmdline-tools') | Out-Null
        Move-Item (Join-Path $env:TEMP 'cmdtools\cmdline-tools') (Join-Path $sdk 'cmdline-tools\latest') -Force
      }
      $env:ANDROID_HOME = $sdk
      $env:ANDROID_SDK_ROOT = $sdk
      [Environment]::SetEnvironmentVariable('ANDROID_HOME', $sdk, 'Process')
      [Environment]::SetEnvironmentVariable('ANDROID_SDK_ROOT', $sdk, 'Process')
      Write-Host "ANDROID_HOME=$sdk"
      & $mgr --sdk_root=$sdk 'platform-tools' 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0' 2>&1 |
        Select-Object -Last 3

build_script:
  # ── the phone half ──
  - ps: |
      $ErrorActionPreference = 'Stop'
      Set-Location openandroiddex-launcher
      .\gradlew.bat --no-daemon assembleDebug
      if ($LASTEXITCODE -ne 0) { throw "launcher APK failed" }
      Set-Location ..

  - ps: |
      $ErrorActionPreference = 'Stop'
      Set-Location openandroiddex-wmd
      .\build.cmd
      if ($LASTEXITCODE -ne 0) { throw "wmd dex failed" }
      Set-Location ..

  # ── scrcpy's client + our patched server ──
  - ps: |
      $ErrorActionPreference = 'Stop'
      $ver = $env:SCRCPY_VERSION
      $bin = "open-android-dex-tauri\src-tauri\resources\bin"
      New-Item -ItemType Directory -Path $bin -Force | Out-Null
      $zip = Join-Path $env:TEMP "scrcpy-win64-v$ver.zip"
      Invoke-WebRequest -Uri "https://github.com/Genymobile/scrcpy/releases/download/v$ver/scrcpy-win64-v$ver.zip" -OutFile $zip
      Expand-Archive $zip -DestinationPath (Join-Path $env:TEMP 'scrcpy') -Force
      Copy-Item (Join-Path $env:TEMP "scrcpy\scrcpy-win64-v$ver\*") $bin -Recurse -Force
      Copy-Item openandroiddex-launcher\app\build\outputs\apk\debug\app-debug.apk (Join-Path $bin 'openandroiddex-launcher.apk') -Force
      Copy-Item openandroiddex-wmd\openandroiddex-wmd.dex (Join-Path $bin 'openandroiddex-wmd.dex') -Force

  - ps: |
      $ErrorActionPreference = 'Stop'
      node openandroiddex-scrcpy/build.mjs
      if ($LASTEXITCODE -ne 0) { throw "scrcpy server failed" }
      Copy-Item openandroiddex-scrcpy\build\scrcpy-server open-android-dex-tauri\src-tauri\resources\bin\scrcpy-server -Force

  # ── the PC half ──
  - ps: |
      $ErrorActionPreference = 'Stop'
      Set-Location open-android-dex-tauri
      npm ci --no-audit --no-fund
      if ($LASTEXITCODE -ne 0) { throw "npm ci failed" }
      $env:SKIP_LAUNCHER_APK = '1'
      $env:SKIP_WMD_DEX = '1'
      $env:SKIP_SCRCPY_SERVER = '1'
      $env:RUSTFLAGS = '-C target-feature=+crt-static'
      npx tauri build
      if ($LASTEXITCODE -ne 0) { throw "tauri build failed" }
      Set-Location ..

  - ps: |
      $ErrorActionPreference = 'Stop'
      $rel = "open-android-dex-tauri\src-tauri\target\release"
      New-Item -ItemType Directory -Path dist -Force | Out-Null
      New-Item -ItemType Directory -Path portable -Force | Out-Null
      Copy-Item "$rel\open-android-dex-tauri.exe" portable\
      if (Test-Path "$rel\resources") { Copy-Item "$rel\resources" portable\resources -Recurse }
      Compress-Archive -Path portable\* -DestinationPath dist\Dex-X-windows-x64-portable.zip -Force
      Get-ChildItem "$rel\bundle\nsis" -Filter *.exe -ErrorAction SilentlyContinue |
        ForEach-Object { Copy-Item $_.FullName dist\Dex-X-windows-x64-setup.exe -Force }
      Copy-Item openandroiddex-launcher\app\build\outputs\apk\debug\app-debug.apk dist\Dex-X-launcher.apk -Force
      Get-ChildItem dist | Select-Object Name, Length | Format-Table -AutoSize

artifacts:
  - path: dist\*
    name: Dex-X

# A run that fails before this point leaves nothing to download; keep the build
# log as an artifact so the reason is readable without an AppVeyor account.
on_failure:
  - ps: Get-Content build\*.log -ErrorAction SilentlyContinue | Select-Object -Last 80
